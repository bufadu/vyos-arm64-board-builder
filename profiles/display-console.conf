# Boards booted through GRUB whose primary console is the display (HDMI).
#
# The primary console (last console= on the kernel command line) receives
# systemd status, the initramfs/emergency shell and /dev/console. Use it for
# boards whose serial UART is not reachable without opening the case. The
# serial console keeps the kernel log. Other boards keep the serial primary.
#
nanopi-r3s-lts
